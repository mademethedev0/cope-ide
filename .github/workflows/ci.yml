name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        # Extra leg: PCRE2-enabled build (slice 1 wiring verification).
        # Existing legs are unchanged; matrix.pcre2 is unset (-> OFF) for them.
        include:
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            pcre2: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Configure
        run: >
          cmake -G Ninja -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCOPE_BUILD_CLI=ON
          -DCOPE_BUILD_TESTS=ON
          -DCOPE_USE_PCRE2=${{ matrix.pcre2 || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      # Phase 5 slice 3: differential gate. The same inputs run through
      # std::regex and PCRE2; token differences are reported information,
      # a pattern refused by BOTH engines fails the step.
      - name: Differential regex test (std::regex vs PCRE2)
        if: matrix.pcre2 == 'ON'
        working-directory: build
        run: ./cli/cope_cli difftest --all

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/**/*.log
            build/Testing/Temporary/**
          if-no-files-found: ignore
