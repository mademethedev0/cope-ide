org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

kotlin.code.style=official

# Regex backend for the native library. OFF keeps the first APK build free of a
# FetchContent clone; the CI release job flips it on (-Pcope.pcre2=true), which
# is what removes the ~15% std::regex rule refusals from every screenshot.
cope.pcre2=false
